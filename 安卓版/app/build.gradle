plugins {
    id 'com.android.application'
}

android {
    namespace 'com.skyduel.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.skyduel.game'
        minSdk 24
        targetSdk 36
        versionCode 116
        versionName '1.6.77'   // v3.32.1 坦克击杀文案/重生点避开残骸/远端弹托
        // 物理：真实二次阻力 + 重力 9.8 + 统一弹道模型
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// WebView 宿主：游戏本体为 assets/web/ 下的网页版快照（js/ + vendor/three.module.min.js）
// androidx.webkit 提供 WebViewAssetLoader —— 以 https 域名提供本地资源，
// 使页面处于安全上下文（WebRTC DataChannel / 剪贴板 / getUserMedia 必需）
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
