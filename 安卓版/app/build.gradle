plugins {
    id 'com.android.application'
}

android {
    namespace 'com.skyduel.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.skyduel.game'
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName '0.3.4'   // 删辅助瞄准（视差缺陷劣化弹道）+ 准星校真（光轴平行弹道，远距命中一致）+ 面板滚动重构（按钮常显）
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// WebView 宿主：游戏本体为 assets/web/ 下的网页版快照（js/ + vendor/three.module.min.js）
// androidx.webkit 提供 WebViewAssetLoader —— 以 https 域名提供本地资源，
// 使页面处于安全上下文（WebRTC DataChannel / 剪贴板 / getUserMedia 必需）
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
