# v0.3.0 WebView 架构：游戏本体为 assets/web/ 网页快照，宿主用 androidx.webkit 的
# WebViewAssetLoader 提供安全上下文（WebRTC 必需），因此需要 AndroidX
android.useAndroidX=true

# 工程位于中文路径下（用户指定目录名"安卓版"），AGP 默认直接报错拒绝构建。
# 纯 Java、无 NDK 的工程可以安全关掉这项路径检查。
android.overridePathCheck=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
